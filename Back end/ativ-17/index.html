<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h1>Cadastro de Usuário</h1>
<input type="text" id="nome" placeholder="Nome do usuário">
<button id="enviar">Cadastrar Usuário</button>
<p id="resultado"></p>

<h1>Nova Tarefa</h1>
<input type="text" id="tarefa" placeholder="Descrição da tarefa">
<button id="addTarefa">Salvar Tarefa</button>
<p id="status"></p>

<h1>Lista de Avisos</h1>
<button id="carregar">Atualizar Avisos</button>
<ul id="listaAvisos"></ul>

<h1>Teste de Conexão</h1>
<button id="testar">Verificar Servidor</button>
<p id="msgErro"></p>

<!DOCTYPE html>
<html lang="pt-BR">
<body>
    <h1>Sistema de Mensagens</h1>
    <input type="text" id="textoMsg" placeholder="Digite sua mensagem">
    <button id="btnEnviar">Enviar ao Servidor</button>

    <div id="painelResposta" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc;">
        <strong>Resposta do Servidor:</strong>
        <p id="msgServidor"></p>
        <small id="detalheObjeto"></small>
    </div>

    
</body>
</html>
