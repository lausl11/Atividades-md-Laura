<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastrar</title>
</head>
<body>
    <h1>Cadastresse e tenha acesso a algo muito importante!!</h1>

    <form action="cadastrar">
<h1>informe suas informações</h1>

        <label for="nome">
            <input type="text" id="nome" placeholder="Nome do aluno" required>
        </label> 
        
        <label for="email">
            <input type="email" id="email" placeholder="email" required>
        </label>

        <label for="senha">
            <input type="password" id="cadastrar" placeholder="senha" required>
        </label>
            
        <button id="cadastrar" onclick="location.href='aviso.html'">cadastrar</button>
    </form>
</body>
</html>
